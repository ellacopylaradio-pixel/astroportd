<svg xmlns="http://www.w3.org/2000/svg" class="ill ek" viewBox="0 0 520 744" role="img" aria-labelledby="ek-t ek-d" width="520" height="744">
<title id="ek-t">Les écluses de la station : du coffre au public, selon le mode</title>
<desc id="ek-d">Un canal à six bassins, du plus intime au plus ouvert : coffre, uCloud chiffré, amis réciproques, cercle N1 et N2, constellation, public. Entre deux bassins, une porte ouverte, filtrée ou fermée. Le schéma passe en boucle par les trois modes. Forteresse : photos sur accord, seuls les amis réciproques entrent, copie des amis seulement, le public lit seulement. Village, le mode par défaut : photos envoyées quand l&#x27;ami est seul avec le membre, le cercle écrit sur le relai, copie des amis d&#x27;amis, le public lit seulement. Place publique : comme Village, et tout le monde peut publier. Le coffre n&#x27;est jamais partagé.</desc>
<style>.ek{--ink:#1b1f2a;--mut:#454c61;--pan:#eef1f9;--pan2:#e2e8f8;--line:#6b7390;--acc:#2a46c8;--ok:#14663a;--warn:#8f3b06;--bad:#b3261e;--bg:#ffffff;--wat:#d6e2fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){.ek{--ink:#eef0f8;--mut:#bcc3da;--pan:#1c2133;--pan2:#262d47;--line:#8790ad;--acc:#9bb0ff;--ok:#7fdca6;--warn:#ffb98a;--bad:#ff8a80;--bg:#12151f;--wat:#22305a}}
.ek .bg{fill:var(--bg)}.ek .t{fill:var(--ink);font-size:17px;font-weight:700}.ek .s{fill:var(--mut);font-size:13.5px}.ek .m{text-anchor:middle}
.ek .wat{fill:var(--wat);stroke:var(--line);stroke-width:1.5}.ek .rn{fill:var(--ink);font-size:15.5px;font-weight:700}.ek .rw{fill:var(--mut);font-size:12.5px}
.ek .why{font-size:13.5px;font-weight:700}.ek .door{transform-box:fill-box}.ek .dl{transform-origin:left center}.ek .dr{transform-origin:right center}
.ek .pill{fill:var(--pan);stroke:var(--line);stroke-width:1.2}.ek .pn{fill:var(--mut);font-size:14px;font-weight:700}
.ek .boat{fill:var(--acc)}.ek .ripple{fill:none;stroke:var(--acc);stroke-width:1;opacity:.35}
.ek .lay,.ek .on,.ek .boat,.ek .door{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.ek .ek-p0 .door{transform:scaleX(1.0);fill:var(--bad);animation-name:ek-p0}
.ek .ek-p0 .why{fill:var(--bad)}
@keyframes ek-p0{0%,30%{transform:scaleX(1.0);fill:var(--bad)}33.3%,63.3%{transform:scaleX(1.0);fill:var(--bad)}66.6%,96.6%{transform:scaleX(1.0);fill:var(--bad)}100%{transform:scaleX(1.0);fill:var(--bad)}}
.ek .ek-p1 .door{transform:scaleX(0.12);fill:var(--ok);animation-name:ek-p1}
.ek .ek-p1 .why{fill:var(--ok)}
@keyframes ek-p1{0%,30%{transform:scaleX(0.7);fill:var(--warn)}33.3%,63.3%{transform:scaleX(0.12);fill:var(--ok)}66.6%,96.6%{transform:scaleX(0.12);fill:var(--ok)}100%{transform:scaleX(0.7);fill:var(--warn)}}
.ek .ek-p2 .door{transform:scaleX(0.12);fill:var(--ok);animation-name:ek-p2}
.ek .ek-p2 .why{fill:var(--ok)}
@keyframes ek-p2{0%,30%{transform:scaleX(1.0);fill:var(--bad)}33.3%,63.3%{transform:scaleX(0.12);fill:var(--ok)}66.6%,96.6%{transform:scaleX(0.12);fill:var(--ok)}100%{transform:scaleX(1.0);fill:var(--bad)}}
.ek .ek-p3 .door{transform:scaleX(0.7);fill:var(--warn);animation-name:ek-p3}
.ek .ek-p3 .why{fill:var(--warn)}
@keyframes ek-p3{0%,30%{transform:scaleX(0.7);fill:var(--warn)}33.3%,63.3%{transform:scaleX(0.7);fill:var(--warn)}66.6%,96.6%{transform:scaleX(0.12);fill:var(--ok)}100%{transform:scaleX(0.7);fill:var(--warn)}}
.ek .L0{opacity:0;animation-name:ek-l0}
@keyframes ek-l0{0%,30%{opacity:1}33.0%,96.6%{opacity:0}100%{opacity:1}}
.ek .P0{opacity:0;animation-name:ek-l0}
.ek .L1{opacity:1;animation-name:ek-l1}
@keyframes ek-l1{0%,30.0%{opacity:0}33.3%,63.3%{opacity:1}66.3%,100%{opacity:0}}
.ek .P1{opacity:1;animation-name:ek-l1}
.ek .L2{opacity:0;animation-name:ek-l2}
@keyframes ek-l2{0%,63.3%{opacity:0}66.6%,96.6%{opacity:1}99.6%,100%{opacity:0}}
.ek .P2{opacity:0;animation-name:ek-l2}
@keyframes ek-boat{0%{transform:translateY(0);opacity:0}3%{opacity:1}18%,28%{transform:translateY(92.0px);opacity:1}31%{transform:translateY(92.0px);opacity:0}33.3%{transform:translateY(0);opacity:0}36%{opacity:1}58%{transform:translateY(368.0px);opacity:1}62%,66.5%{transform:translateY(368.0px);opacity:0}66.6%{transform:translateY(0);opacity:0}70%{opacity:1}92%{transform:translateY(368.0px);opacity:1}96%,100%{transform:translateY(368.0px);opacity:0}}
.ek .boat{opacity:0;animation-name:ek-boat}
@media (prefers-reduced-motion:reduce){.ek .lay,.ek .on,.ek .boat,.ek .door{animation:none}}</style>
<rect class="bg" width="520" height="744" rx="14"/>
<text x="260.0" y="32" class="t m">Les écluses : jusqu'où vont vos données ?</text>
<rect class="pill" x="16" y="50" width="156" height="34" rx="17"/>
<rect class="on P0" x="16" y="50" width="156" height="34" rx="17" style="fill:var(--pan2);stroke:var(--acc);stroke-width:2.5"/>
<text x="94.0" y="72" class="pn m">🏰 Forteresse</text>
<rect class="pill" x="182" y="50" width="156" height="34" rx="17"/>
<rect class="on P1" x="182" y="50" width="156" height="34" rx="17" style="fill:var(--pan2);stroke:var(--acc);stroke-width:2.5"/>
<text x="260.0" y="72" class="pn m">🏡 Village (défaut)</text>
<rect class="pill" x="348" y="50" width="156" height="34" rx="17"/>
<rect class="on P2" x="348" y="50" width="156" height="34" rx="17" style="fill:var(--pan2);stroke:var(--acc);stroke-width:2.5"/>
<text x="426.0" y="72" class="pn m">🎪 Place publique</text>
<text x="260.0" y="110" class="s m lay L0" style="font-style:italic">Seuls les amis réciproques entrent, pas d&#x27;inscription libre</text>
<text x="260.0" y="110" class="s m lay L1" style="font-style:italic">Les amis d&#x27;amis écrivent, rien de privé ne sort</text>
<text x="260.0" y="110" class="s m lay L2" style="font-style:italic">Tout le monde peut publier profil et notes</text>
