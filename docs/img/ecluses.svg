<text x="30" y="179" class="rn">🔐 Coffre</text>
<text x="30" y="199" class="rw">le membre seul</text>
<rect class="wat" x="16" y="244" width="300" height="62" rx="10"/>
<text x="30" y="271" class="rn">☁️ uCloud chiffré</text>
<text x="30" y="291" class="rw">les membres hébergés</text>
<rect class="wat" x="16" y="336" width="300" height="62" rx="10"/>
<text x="30" y="363" class="rn">🤝 Amis réciproques</text>
<text x="30" y="383" class="rw">ils se suivent l&#x27;un l&#x27;autre</text>
<rect class="wat" x="16" y="428" width="300" height="62" rx="10"/>
<text x="30" y="455" class="rn">👥 Cercle N¹ + N²</text>
<text x="30" y="475" class="rw">suivis, amis d&#x27;amis</text>
<rect class="wat" x="16" y="520" width="300" height="62" rx="10"/>
<text x="30" y="547" class="rn">🌐 Constellation</text>
<text x="30" y="567" class="rw">stations ORIGIN ou ẐEN</text>
<rect class="wat" x="16" y="612" width="300" height="62" rx="10"/>
<text x="30" y="639" class="rn">🌍 Public</text>
<text x="30" y="659" class="rw">tout le monde</text>
